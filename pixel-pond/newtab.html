<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="animals" aria-hidden="true" hidden></canvas>
  <canvas id="glow" aria-hidden="true" hidden></canvas>

  <header class="top">
    <a href="https://mail.google.com/mail/">Gmail</a>
    <a href="https://www.google.com/imghp">Images</a>
    <a class="apps" href="https://about.google/products/" title="Google apps" aria-label="Google apps">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
    </a>
  </header>

  <main class="center">
    <h1 id="greeting" class="greeting"><span id="gpart"></span><span id="gname" class="gname" title="Click to change the name" tabindex="0"></span><span id="gend"></span></h1>

    <form id="search" class="search" autocomplete="off">
      <div class="srow">
        <svg class="s-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
        <input id="q" type="text" placeholder="Ask anything…" aria-label="Search" autofocus>
      </div>
      <div class="srow2">
        <button type="button" class="chipb" id="plusBtn">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
          Search by image
        </button>
        <button type="button" class="chipb" id="aiBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/><path d="M18 3v4M16 5h4" stroke-width="1.6"/></svg>
          AI Mode
        </button>
        <span class="grow"></span>
        <button type="button" class="ib" id="micBtn" title="Search by voice" aria-label="Search by voice">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button type="submit" class="send" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
        </button>
      </div>
    </form>

    <div id="siteList" class="sites"></div>
  </main>

  <button id="tweaksBtn" class="customize" type="button" aria-expanded="false" aria-controls="tweaks">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/></svg>
    Customize
  </button>

  <aside id="tweaks" class="panel" hidden>
    <div class="row col">
      <span>Animals</span>
      <nav id="species" class="pill" aria-label="Animals"></nav>
    </div>
    <div class="row own-only">
      <span>Style</span>
      <div class="seg" id="styleSeg">
        <button type="button" data-style="tiles">Tiles</button>
        <button type="button" data-style="blocks">Blocks</button>
        <button type="button" data-style="ascii">ASCII</button>
      </div>
    </div>
    <label class="row"><span>How many <b id="countVal"></b></span><input id="count" type="range" min="3" max="40"></label>
    <label class="row"><span>Pixel size <b id="cellVal"></b></span><input id="cell" type="range" min="6" max="16"></label>
    <label class="row"><span>Glow</span><input id="glowToggle" type="checkbox"></label>
    <label class="row"><span>Shortcuts</span><input id="sites" type="checkbox"></label>
    <label class="row col"><span>Name in greeting</span><input id="nameIn" type="text" maxlength="30" placeholder="Your name"></label>
    <label class="row col"><span>Greeting font</span><select id="fontSel"></select></label>
    <button id="resetSites" class="link" type="button">Reset shortcuts to most visited</button>
    <p class="hint">Click the water to sprinkle food. Nearby koi swim over and eat it. Move your cursor near the animals and they scatter.</p>
  </aside>

  <dialog id="scDialog" class="dlg">
    <form id="scForm">
      <h2 id="scTitle">Add shortcut</h2>
      <label>Name<input id="scName" type="text" maxlength="40"></label>
      <label>URL<input id="scUrl" type="text" required></label>
      <div class="dlg-actions">
        <button id="scRemove" type="button" class="danger">Remove</button>
        <span class="grow"></span>
        <button id="scCancel" type="button">Cancel</button>
        <button type="submit" class="primary">Done</button>
      </div>
    </form>
  </dialog>

  <script src="newtab.js"></script>
  <script type="module" src="animals-bridge.js"></script>
</body>
</html>
